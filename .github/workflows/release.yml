name: Release Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate committed release versions
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          const ui = JSON.parse(fs.readFileSync('ui/package.json', 'utf8')).version;
          const manifest = fs.readFileSync('plugin.yaml', 'utf8').match(/^version:\s*(\S+)\s*$/m)?.[1];
          const metadata = JSON.parse(fs.readFileSync('plugin.json', 'utf8')).version;
          const packaged = fs.readFileSync('.package/plugin.yaml', 'utf8').match(/^version:\s*(\S+)\s*$/m)?.[1];
          if ([ui, manifest, metadata, packaged].some(value => value !== version)) {
            throw new Error(`Commit release versions before tagging: requested=${version}, ui=${ui}, manifest=${manifest}, metadata=${metadata}, packaged=${packaged}`);
          }
          NODE

  publish:
    needs: validate-version
    uses: omniviewdev/publish-plugin-action/.github/workflows/build-and-publish.yml@v1
    with:
      go-version: '1.25'
      pnpm-version: '12.14.0'
      node-version: '22'
      plugin-id: kubernetes
      publisher-slug: omniview
      api-url: https://api.omniview.dev
      version: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      go-entry: ./pkg
      ui-path: ./ui
    secrets:
      api-key: ${{ secrets.OMNIVIEW_API_KEY }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
